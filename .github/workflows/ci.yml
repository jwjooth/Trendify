name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          version: latest

      - name: Cache Bun installations
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-installations-${{ runner.os }}-${{ hashFiles('.') }}
          restore-keys: |
            bun-installations-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test run --coverage

      - name: Build verification
        run: bun run build

      - name: Security audit
        run: bun audit